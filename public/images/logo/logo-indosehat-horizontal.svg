<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="crestNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3B85" />
      <stop offset="100%" stop-color="#072E6D" />
    </linearGradient>
    <linearGradient id="crimsonCross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C51E3A" />
      <stop offset="100%" stop-color="#A41727" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#072E6D" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Crest Symbol (Left Icon) -->
  <g transform="translate(10, 8)" filter="url(#softGlow)">
    <!-- Outer Shield Background -->
    <path d="M42 2 C68 2, 80 14, 80 34 C80 58, 54 74, 42 82 C30 74, 4 58, 4 34 C4 14, 16 2, 42 2 Z" fill="url(#crestNavy)" />
    <!-- Inner Accent Border -->
    <path d="M42 6 C64 6, 75 16, 75 34 C75 55, 52 69, 42 76 C32 69, 9 55, 9 34 C9 16, 20 6, 42 6 Z" stroke="#DEE4F1" stroke-width="1.5" fill="none" opacity="0.8" />
    
    <!-- Maritime Anchor Arc -->
    <path d="M26 44 C26 54, 33 60, 42 60 C51 60, 58 54, 58 44" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M22 42 L26 44 L30 40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M62 42 L58 44 L54 40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="42" y1="20" x2="42" y2="58" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <circle cx="42" cy="18" r="4.5" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
    <line x1="32" y1="26" x2="52" y2="26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Clinical Cross Center Emblem -->
    <g transform="translate(32, 28)">
      <rect x="6" y="0" width="8" height="24" rx="2" fill="url(#crimsonCross)" />
      <rect x="0" y="8" width="20" height="8" rx="2" fill="url(#crimsonCross)" />
      <rect x="7" y="1" width="6" height="22" rx="1" fill="#FFFFFF" opacity="0.25" />
      <rect x="1" y="9" width="18" height="6" rx="1" fill="#FFFFFF" opacity="0.25" />
    </g>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(108, 22)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#072E6D" letter-spacing="0.5">
      KLINIK INDOSEHAT
      <tspan fill="#A41727" font-weight="900" dx="4">2003</tspan>
    </text>

    <!-- Subtitle / Medical Authority -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#4B5563" letter-spacing="2">
      MARITIME &amp; OCCUPATIONAL HEALTH CENTER
    </text>

    <!-- Accreditations & Standards Indicator -->
    <g transform="translate(0, 53)">
      <rect x="0" y="0" width="68" height="15" rx="3" fill="#EBF3FE" />
      <text x="34" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#0E3B85" text-anchor="middle">
        PERHUBUNGAN
      </text>

      <rect x="74" y="0" width="56" height="15" rx="3" fill="#FEE2E2" />
      <text x="102" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">
        KEMENKES
      </text>

      <rect x="136" y="0" width="60" height="15" rx="3" fill="#F0FDF4" />
      <text x="166" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">
        TERAKREDITASI
      </text>
    </g>
  </g>
</svg>
