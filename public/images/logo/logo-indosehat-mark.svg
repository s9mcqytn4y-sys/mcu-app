<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="markNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3B85" />
      <stop offset="100%" stop-color="#072E6D" />
    </linearGradient>
    <linearGradient id="markCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#A41727" />
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#072E6D" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Outer Container -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />

  <!-- Shield Badge -->
  <g transform="translate(16, 12)" filter="url(#markShadow)">
    <path d="M44 2 C72 2, 86 16, 86 38 C86 64, 58 82, 44 92 C30 82, 2 64, 2 38 C2 16, 16 2, 44 2 Z" fill="url(#markNavy)" />
    <path d="M44 7 C68 7, 80 18, 80 38 C80 60, 55 76, 44 84 C33 76, 8 60, 8 38 C8 18, 20 7, 44 7 Z" stroke="#DEE4F1" stroke-width="1.5" fill="none" opacity="0.6" />

    <!-- Maritime Anchor Structure -->
    <path d="M26 48 C26 60, 34 68, 44 68 C54 68, 62 60, 62 48" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M20 45 L26 48 L31 43" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M68 45 L62 48 L57 43" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="44" y1="20" x2="44" y2="66" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="44" cy="18" r="5.5" stroke="#FFFFFF" stroke-width="3" fill="none" />
    <line x1="32" y1="27" x2="56" y2="27" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

    <!-- Medical Crimson Cross Core -->
    <g transform="translate(34, 30)">
      <rect x="7" y="0" width="8" height="26" rx="2" fill="url(#markCrimson)" />
      <rect x="0" y="9" width="22" height="8" rx="2" fill="url(#markCrimson)" />
      <rect x="8" y="1" width="6" height="24" rx="1" fill="#FFFFFF" opacity="0.3" />
      <rect x="1" y="10" width="20" height="6" rx="1" fill="#FFFFFF" opacity="0.3" />
    </g>
  </g>
</svg>
