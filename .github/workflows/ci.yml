name: Laravel MCU App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, gd, zip
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install NPM Dependencies & Build Assets
      run: |
        npm ci
        npm run build

    - name: Prepare Environment & SQLite Database
      run: |
        cp .env.example .env
        php artisan key:generate
        touch database/database.sqlite

    - name: Run Migrations
      run: php artisan migrate --force

    - name: Execute Tests via PHPUnit / Pest
      run: php artisan test --colors=always

  deploy-hpanel:
    name: Deploy to Hostinger Cloud (hPanel)
    needs: laravel-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hostinger Git Auto-Deploy Webhook
        env:
          HOSTINGER_WEBHOOK_URL: ${{ secrets.HOSTINGER_WEBHOOK_URL }}
        run: |
          if [ -z "$HOSTINGER_WEBHOOK_URL" ]; then
            echo "HOSTINGER_WEBHOOK_URL secret is not yet configured in GitHub Secrets."
            echo "Deployment step skipped safely until the secret is populated."
          else
            echo "Triggering Hostinger hPanel Git Auto-Deploy..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOSTINGER_WEBHOOK_URL")
            echo "Hostinger Auto-Deploy Webhook returned HTTP $HTTP_STATUS."
          fi

