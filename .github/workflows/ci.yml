name: Laravel MCU App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, sqlite3, pdo_sqlite, gd, zip
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install NPM Dependencies & Build Assets
      run: |
        npm ci
        npm run build

    - name: Prepare Environment & SQLite Database
      run: |
        cp .env.example .env
        php artisan key:generate
        touch database/database.sqlite

    - name: Check PHP database drivers (SQLite and MySQL)
      run: |
        php scripts/check-database-driver.php
        DB_CONNECTION=mysql php scripts/check-database-driver.php

    - name: Run Migrations
      run: php artisan migrate --force

    - name: Execute Tests via PHPUnit / Pest
      run: php artisan test --colors=always
