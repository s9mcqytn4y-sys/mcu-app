name: Laravel MCU App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    name: Test & Build (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mcu_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup PHP & Extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, sqlite3, pdo_sqlite, gd, zip
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install NPM Dependencies & Build Assets
      run: |
        npm ci
        npm run build

    - name: Prepare Environment & App Key
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run Database Migrations on PostgreSQL
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: mcu_testing
        DB_USERNAME: postgres
        DB_PASSWORD: password
      run: php artisan migrate --force

    - name: Execute Tests Suite via PHPUnit on PostgreSQL
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: mcu_testing
        DB_USERNAME: postgres
        DB_PASSWORD: password
      run: php artisan test --colors=always

  deploy-hpanel:
    name: Staging & Deploy Verification (Hostinger Cloud)
    needs: laravel-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hostinger Git Auto-Deploy Webhook
        env:
          HOSTINGER_WEBHOOK_URL: ${{ secrets.HOSTINGER_WEBHOOK_URL }}
        run: |
          if [ -z "$HOSTINGER_WEBHOOK_URL" ]; then
            echo "HOSTINGER_WEBHOOK_URL secret is not yet configured in GitHub Secrets."
            echo "Deployment step skipped safely until the secret is populated."
          else
            echo "Triggering Hostinger hPanel Git Auto-Deploy..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOSTINGER_WEBHOOK_URL")
            echo "Hostinger Auto-Deploy Webhook returned HTTP $HTTP_STATUS."
            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
              echo "Deployment trigger returned non-200 status: $HTTP_STATUS"
              exit 1
            fi
          fi

      - name: Post-Deployment Health Check Verification
        run: |
          echo "Verifying application availability..."
          PROD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://klinikindosehat2003.com/up" || true)
          echo "Production health check endpoint (/up) returned: $PROD_STATUS"
